name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/testing-r61hfk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Route Handlers need a server at request time and can't be part of a
      # static export. This only affects the exported Pages artifact — the
      # route stays in the repo for local/server-mode use.
      - name: Remove routes unsupported by static export
        run: rm -rf app/api

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Public URL of the eBay proxy Worker. A repository *variable*, not a
          # secret: it's the endpoint the browser calls. The eBay credentials
          # live only inside the Worker and never reach this build.
          # Leave unset and the app simply runs without live search.
          NEXT_PUBLIC_BUYWISE_API_URL: ${{ vars.NEXT_PUBLIC_BUYWISE_API_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
